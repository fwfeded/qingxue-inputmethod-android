[workspace]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
qingjian-core = { path = "../../../crates/qingjian-core" }
qingjian-dictionary = { path = "../../../crates/qingjian-dictionary" }
qingjian-translate = { path = "../../../crates/qingjian-translate" }
qingjian-learning = { path = "../../../crates/qingjian-learning" }
serde_json = "1.0.151"

[package]
name = "qingjian-android"
version = "0.1.0-dev"
edition.workspace = true
license.workspace = true

[lib]
name = "qingjian_android"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
qingjian-core.workspace = true
qingjian-dictionary.workspace = true
qingjian-translate.workspace = true
qingjian-learning.workspace = true
serde_json.workspace = true
qingjian-lm = { version = "0.1.1", path = "../../../crates/qingjian-lm" }
qingjian-format = { version = "0.1.1", path = "../../../crates/qingjian-format" }
jiff = "0.2.38"
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
libc = "0.2.190"
